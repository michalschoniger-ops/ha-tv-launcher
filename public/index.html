<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#12182b">
  <title>HA TV Launcher</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/house-map.css">
  <link rel="stylesheet" href="/household-ui.css">
  <link rel="stylesheet" href="/domestic-ui.css">
  <link rel="stylesheet" href="/notice-preferences.css">
  <link rel="stylesheet" href="/weather-background.css">
  <link rel="stylesheet" href="/tv-controls.css">
  <script src="/calendar-utils.js" defer></script>
  <script src="/camera-player.js" defer></script>
  <script src="/house-map.js" defer></script>
  <script src="/household-ui.js" defer></script>
  <script src="/domestic-ui.js" defer></script>
  <script src="/notice-preferences.js" defer></script>
  <script src="/weather-background.js" defer></script>
  <script src="/navigation-sound.js" defer></script>
  <script src="/power-updates.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="wallpaper" aria-hidden="true"><div class="photo-layer" id="photo-a"></div><div class="photo-layer" id="photo-b"></div><div class="aurora"></div><div class="mountain far"></div><div class="mountain near"></div><div class="wallpaper-shade"></div></div>
  <div class="app-shell" id="app-shell">
    <header class="topbar">
      <a class="wordmark" href="#home" aria-label="HA TV Launcher, úvod"><span id="brand-icon"></span>HA<span class="tv-mark">TV</span></a>
      <nav class="glass navigation" aria-label="Hlavní navigace">
        <button data-tab="home" class="nav-item active">Přehled</button>
        <button data-tab="media" class="nav-item">Média</button>
        <button data-tab="cameras" class="nav-item">Kamery</button>
        <button data-tab="calendar" class="nav-item">Kalendář</button>
        <button data-tab="household" class="nav-item">Domov</button>
        <button data-tab="apps" class="nav-item">Aplikace</button>
      </nav>
      <div class="top-actions"><button class="icon-button" id="appearance-button" aria-label="Vzhled a pozadí"></button><button class="icon-button" id="notices-button" aria-label="Oznámení domácnosti"></button><button class="icon-button" id="assistant-button" aria-label="Asistent"></button><button class="icon-button" id="screensaver-button" aria-label="Spustit spořič"></button><button class="profile" id="settings-button" aria-label="Nastavení">M</button></div>
    </header>
    <main id="main-content">
      <div class="welcome"><h1 id="greeting">Dobrý večer.</h1><div class="welcome-info"><div class="welcome-meta"><p class="eyebrow" id="date-label"></p><p class="welcome-sub" id="nameday-line">Tvoje rodina. Tvůj domov. Všechno blíž.</p></div><div class="welcome-right"><span class="mode-badge" id="mode-badge">Náhled · ukázková data</span><div class="clock" id="clock">18:42</div><span class="connection-label" id="connection-label">Android TV</span></div></div></div>
      <section id="view-content" aria-live="polite"></section>
    </main>
    <footer class="footer hidden" aria-hidden="true"><div><span class="connection-dot"></span><span id="footer-status">Lokální náhled</span><span class="footer-divider">/</span><span id="footer-photo">Rodinné fotografie čekají na přidání</span></div><div><kbd>↑ ↓ ← →</kbd> pohyb <kbd>OK</kbd> vybrat <kbd>M</kbd> kurzor <button id="help-button">Nápověda</button></div></footer>
  </div>
  <section id="screensaver" class="screensaver hidden" aria-label="Rodinný spořič"><div class="saver-top"><div class="saver-identity"><img id="saver-avatar" class="saver-avatar hidden" alt="Rodina domácnosti"><div><span class="saver-brand">HA TV Launcher</span><span class="saver-family">Domácnost</span></div></div><button id="exit-saver" class="glass small-button">Zpět na přehled</button></div><div class="saver-center"><time id="saver-clock"></time><p id="saver-date"></p></div><div class="saver-bottom glass" id="saver-status"></div><span class="saver-caption" id="saver-caption"></span><span class="saver-freshness" id="saver-freshness"></span></section>
  <div id="notifications" class="notification-stack" aria-live="assertive"></div>
  <div id="dialog-root"></div>
  <div id="virtual-cursor" class="virtual-cursor hidden" aria-hidden="true"></div>
</body>
</html>
