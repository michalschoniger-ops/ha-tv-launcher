name: Kontroly

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-and-home-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Kontrola syntaxe
        run: npm run check
      - name: Testy backendu
        run: npm test
      - name: Testy aplikace Home Assistant
        run: node --test ha-app/test/*.test.mjs
      - name: Shoda HA balíčku se zdroji
        run: npm run check:addon
